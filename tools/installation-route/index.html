<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f6f9">
  <meta name="description" content="Private installation crew route.">
  <title>Installation Route</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="site-header"><div><span>FIELD OPERATIONS</span><strong>Installation route</strong></div><span class="sync-state" id="syncState">Opening…</span></header>
  <main id="routeContent"><section class="loading" id="loading"><i></i><strong>Opening crew route…</strong><span>The encrypted plan is being unlocked on this device.</span></section></main>

  <dialog id="doneDialog">
    <form method="dialog">
      <span class="eyebrow">CONFIRM COMPLETION</span>
      <h2>Mark this job done?</h2>
      <p id="doneJobName"></p>
      <small>This will update dispatch and Monday. Check the job is genuinely finished before confirming.</small>
      <footer><button value="cancel">Go back</button><button class="confirm" id="confirmDone" type="button">Yes, mark done</button></footer>
    </form>
  </dialog>
  <script type="module" src="./app.js"></script>
</body>
</html>
