<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102c3a">
  <meta name="description" content="A clear mobile itinerary for Expert Windows survey routes.">
  <title>Sasha’s route · Expert Windows</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="skip-link" href="#routeContent">Skip to route</a>
  <header class="site-header">
    <a class="identity" href="./" aria-label="Expert Windows survey route reader">
      <span class="identity-mark" aria-hidden="true">EW</span>
      <span><strong>Field route</strong><small>Expert Windows</small></span>
    </a>
    <span class="reader-label">SURVEY DAY</span>
  </header>

  <main id="routeContent">
    <section class="loading-state" id="loadingState" aria-live="polite">
      <span class="loading-pulse" aria-hidden="true"></span>
      <strong>Opening Sasha’s route…</strong>
    </section>
    <section class="reader-app" id="readerApp" hidden></section>
  </main>

  <noscript><p class="fatal-message">JavaScript is required to read this route.</p></noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
